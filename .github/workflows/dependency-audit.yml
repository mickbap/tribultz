name: Dependency Audit

# Auditoria contínua de dependências — institucionalizada pela Ordem Técnica
# "Execução da Categoria A e Institucionalização da Auditoria de Dependências"
# (2026-07-18), complemento da Auditoria de Dependências manual de 2026-07-18
# (docs/sprints/2026-07-18_atualizacao_continua_dependencias.md).
#
# Roda pip-audit (backend) + npm audit (frontend) toda semana; na primeira
# segunda-feira do mês, roda também a comparação de versões instaladas vs.
# estáveis disponíveis e o inventário de imagens Docker / GitHub Actions.
# Produz sempre um relatório em artifact. Nunca abre Pull Request — quando
# há vulnerabilidade Alta/Crítica sem nenhuma versão de correção publicada,
# abre (ou comenta, se já existir) uma Issue.

on:
  schedule:
    - cron: "0 6 * * 1"   # toda segunda-feira, 06:00 UTC — foco em CVEs
    - cron: "0 6 1 * *"   # dia 1 de cada mês, 06:00 UTC — revisão completa
  workflow_dispatch:
    inputs:
      full_review:
        description: "Forçar revisão completa (versões + infraestrutura), não só CVEs"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Determinar modo (semanal=CVEs / mensal=revisão completa)
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 6 1 * *" ] || [ "${{ inputs.full_review }}" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python (pin)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.6"

      - name: Setup Node (pin)
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"

      - name: Instalar dependências do backend + pip-audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip "uv==0.11.29"
          uv pip install --system -r requirements.txt
          uv pip install --system pip-audit

      - name: pip-audit (backend)
        working-directory: backend
        run: |
          mkdir -p /tmp/dependency-audit/raw
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          timeout 180 pip-audit -r requirements.txt --format json \
            > /tmp/dependency-audit/raw/pip-audit.json \
            2> /tmp/dependency-audit/raw/pip-audit.stderr.txt
          EXIT_CODE=$?
          set -e
          FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TIMED_OUT=false
          if [ "$EXIT_CODE" -eq 124 ] || [ "$EXIT_CODE" -eq 137 ]; then
            TIMED_OUT=true
          fi
          jq -n \
            --arg scanner "pip-audit" \
            --arg command "pip-audit -r requirements.txt --format json" \
            --arg started_at "$STARTED_AT" \
            --arg finished_at "$FINISHED_AT" \
            --argjson exit_code "$EXIT_CODE" \
            --argjson timed_out "$TIMED_OUT" \
            '{scanner:$scanner,command:$command,started_at:$started_at,finished_at:$finished_at,exit_code:$exit_code,timed_out:$timed_out,timeout_seconds:180}' \
            > /tmp/dependency-audit/raw/pip-audit.metadata.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          mkdir -p /tmp/dependency-audit/raw
          cp package-lock.json /tmp/dependency-audit/raw/npm-lock.json
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          timeout 180 npm audit --json \
            > /tmp/dependency-audit/raw/npm-audit.json \
            2> /tmp/dependency-audit/raw/npm-audit.stderr.txt
          EXIT_CODE=$?
          set -e
          FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TIMED_OUT=false
          if [ "$EXIT_CODE" -eq 124 ] || [ "$EXIT_CODE" -eq 137 ]; then
            TIMED_OUT=true
          fi
          jq -n \
            --arg scanner "npm-audit" \
            --arg command "npm audit --json" \
            --arg started_at "$STARTED_AT" \
            --arg finished_at "$FINISHED_AT" \
            --argjson exit_code "$EXIT_CODE" \
            --argjson timed_out "$TIMED_OUT" \
            '{scanner:$scanner,command:$command,started_at:$started_at,finished_at:$finished_at,exit_code:$exit_code,timed_out:$timed_out,timeout_seconds:180}' \
            > /tmp/dependency-audit/raw/npm-audit.metadata.json

      - name: Comparação de versões — backend (revisão completa)
        if: steps.mode.outputs.full == 'true'
        working-directory: backend
        run: |
          python3 -m pip list --outdated --format json > /tmp/pip-outdated.json || echo "[]" > /tmp/pip-outdated.json
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/pip-outdated.json"))
          with open("/tmp/versions.md", "w") as f:
              f.write("## Comparação de versões — Backend (pip)\n\n")
              if not data:
                  f.write("Nenhuma dependência instalada com atualização pendente.\n\n")
              for d in data:
                  f.write(f"- **{d['name']}**: {d['version']} → {d['latest_version']}\n")
              f.write("\n")
          PY

      - name: Comparação de versões — frontend (revisão completa)
        if: steps.mode.outputs.full == 'true'
        working-directory: frontend
        run: |
          npm outdated --json > /tmp/npm-outdated.json 2>/dev/null || echo "{}" > /tmp/npm-outdated.json
          python3 - <<'PY'
          import json
          try:
              data = json.load(open("/tmp/npm-outdated.json"))
          except json.JSONDecodeError:
              data = {}
          with open("/tmp/versions.md", "a") as f:
              f.write("## Comparação de versões — Frontend (npm)\n\n")
              if not data:
                  f.write("Nenhuma dependência instalada com atualização pendente.\n\n")
              for name, info in data.items():
                  f.write(f"- **{name}**: {info.get('current')} → {info.get('latest')}\n")
              f.write("\n")
          PY

      - name: Infraestrutura — imagens Docker e GitHub Actions (revisão completa)
        if: steps.mode.outputs.full == 'true'
        run: |
          {
            echo "## Infraestrutura"
            echo ""
            echo "### Imagens Docker em uso (infra/docker-compose.yml)"
            grep -ohE 'image:.*' infra/docker-compose.yml | sed 's/^/- /'
            echo ""
            echo "### GitHub Actions em uso (.github/workflows/)"
            grep -rohE 'uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[A-Za-z0-9._-]+' .github/workflows/*.yml | sed 's/^/- /' | sort -u
            echo ""
          } >> /tmp/versions.md

      - name: Validar execução e classificar achados
        id: analysis
        run: |
          python3 .github/scripts/dependency_audit.py \
            --evidence-dir /tmp/dependency-audit/raw \
            --output-dir /tmp/dependency-audit/analysis
          if [ -f /tmp/versions.md ]; then
            cat /tmp/versions.md >> /tmp/dependency-audit/analysis/summary.md
          fi
          STATE=$(jq -r .execution_state /tmp/dependency-audit/analysis/result.json)
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          cat /tmp/dependency-audit/analysis/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/dependency-audit/analysis/summary.md

      - name: Preservar evidência bruta e análise
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-evidence
          path: /tmp/dependency-audit
          retention-days: 90

      - name: Encaminhar achados e exceções sem duplicação
        if: always() && steps.analysis.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -r '.[] | "- **\(.scanner)**: \(.reasons | join(", "))"' \
            /tmp/dependency-audit/analysis/operational-failures.json \
            > /tmp/dependency-audit/analysis/operational-failures.md

          route_issue() {
            FILE=$1
            TITLE=$2
            KIND=$3
            [ -s "$FILE" ] || return 0
            DIGEST=$(sha256sum "$FILE" | cut -d' ' -f1)
            MARKER="<!-- dependency-audit-fingerprint:${KIND}:${DIGEST} -->"
            BODY="/tmp/dependency-audit/analysis/issue-${KIND}.md"
            {
              echo "$MARKER"
              cat "$FILE"
              echo ""
              echo "SHA analisado: $GITHUB_SHA. Triagem existente: #746 (frontend), #747 (Python), #504 (exceções)."
              echo "Evidência bruta e metadados: artifact \`dependency-audit-evidence\` do run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > "$BODY"
            EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
            if [ -z "$EXISTING" ]; then
              gh issue create --title "$TITLE" --label "security" --body-file "$BODY"
              return 0
            fi
            HISTORY=$(gh issue view "$EXISTING" --json body,comments --jq '[.body, (.comments[].body)] | join("\n")')
            if grep -Fq "$MARKER" <<< "$HISTORY"; then
              echo "Achado já encaminhado em #$EXISTING ($KIND); sem duplicação."
            else
              gh issue comment "$EXISTING" --body-file "$BODY"
            fi
          }

          route_issue "/tmp/dependency-audit/analysis/fixable.md" \
            "Auditoria de Dependências: vulnerabilidades corrigíveis" "fixable"
          route_issue "/tmp/dependency-audit/analysis/no-patch.md" \
            "Auditoria de Dependências: patch não declarado ou não verificado" "no-patch"
          route_issue "/tmp/dependency-audit/analysis/operational-failures.md" \
            "Auditoria de Dependências: falha operacional do scanner" "operational"

      - name: Aplicar decisão do gate
        if: always()
        env:
          ANALYSIS_STATE: ${{ steps.analysis.outputs.state }}
        run: |
          case "$ANALYSIS_STATE" in
            SCAN_VALID_NO_FINDINGS|SCAN_VALID_WITH_FINDINGS)
              echo "Auditoria válida: $ANALYSIS_STATE"
              ;;
            SCAN_OPERATIONAL_FAILURE)
              echo "FAIL_CLOSED_OPERATIONAL_FAILURE: resultado não verificável" >&2
              exit 1
              ;;
            *)
              echo "FAIL_CLOSED_OPERATIONAL_FAILURE: análise ausente/inválida" >&2
              exit 1
              ;;
          esac
