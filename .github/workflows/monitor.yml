name: Uptime Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # disponibilidade — a cada 5 minutos
    - cron: "17 * * * *"    # frescor regulatório (#673) — 1x/hora
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  health-check:
    name: GET /health/deep
    # Só na cadência de 5 min: disponibilidade. O frescor regulatório tem job
    # próprio abaixo, com cadência própria.
    if: github.event.schedule != '17 * * * *' 
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Probe health endpoint
        id: probe
        run: |
          RESPONSE=$(curl -sf --max-time 10 \
            https://api.tribultz.com.br/health/deep 2>&1) || {
            echo "status=unreachable" >> "$GITHUB_OUTPUT"
            echo "body=$RESPONSE"     >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "body=$RESPONSE" >> "$GITHUB_OUTPUT"
          STATUS=$(echo "$RESPONSE" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Fail on error
        if: steps.probe.outputs.status == 'error' || steps.probe.outputs.status == 'unreachable'
        run: |
          echo "::error::Health check FAILED — status: ${{ steps.probe.outputs.status }}"
          echo "Response: ${{ steps.probe.outputs.body }}"
          exit 1

      - name: Send alert email (Resend)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PROBE_STATUS:   ${{ steps.probe.outputs.status }}
          PROBE_BODY:     ${{ steps.probe.outputs.body }}
        run: |
          python3 - << 'PY'
          import os, json, urllib.request, urllib.error

          key    = os.environ["RESEND_API_KEY"]
          status = os.environ.get("PROBE_STATUS", "unknown")
          body   = os.environ.get("PROBE_BODY", "")

          payload = json.dumps({
            "from": "noreply@tribultz.com.br",
            "to":   ["mickel@tribultz.com.br"],
            "subject": f"[ALERTA] Tribultz API — status: {status}",
            "html": f"<h2>Tribultz API degradada</h2>"
                    f"<p><b>Status:</b> {status}</p>"
                    f"<pre>{body[:2000]}</pre>"
                    f"<p><a href='https://api.tribultz.com.br/health/deep'>Ver health</a></p>",
          }).encode()

          req = urllib.request.Request(
            "https://api.resend.com/emails",
            data=payload,
            headers={
              "Authorization": f"Bearer {key}",
              "Content-Type":  "application/json",
              # Sem isto, o urllib manda "Python-urllib/3.x" como User-Agent — o WAF
              # (Cloudflare) na frente da API do Resend bloqueia com 403 "error code:
              # 1010" ("banned based on your browser's signature"). Confirmado em
              # produção (2026-07-20/21): o alerta nunca chegou a ser entregue, mesmo
              # reportando sucesso no job — falha silenciosa do próprio mecanismo de
              # último recurso.
              "User-Agent": "tribultz-ci/1.0",
            },
          )
          try:
            with urllib.request.urlopen(req, timeout=10) as r:
              print("Alert sent:", r.status)
          except urllib.error.HTTPError as e:
            # Antes só imprimia — o step reportava sucesso mesmo com a entrega
            # falhando (mesmo incidente do 403/1010 acima). Falhar de verdade aqui
            # é o que torna uma futura quebra do próprio alerta visível.
            raise SystemExit(f"Resend error: {e.read().decode()}")
          PY

      - name: Log status (degraded warning)
        if: steps.probe.outputs.status == 'degraded'
        run: |
          echo "::warning::API degraded — serviços opcionais com falha"
          echo "${{ steps.probe.outputs.body }}"

  # ── Frescor regulatório (#673, Round 3) ─────────────────────────────────────
  # Dado cClassTrib velho produz `degraded`, nunca `error` — dado regulatório
  # desatualizado é problema de CONFIANÇA, não de disponibilidade, e não pode
  # derrubar o produto. Mas até agora `degraded` só virava anotação no log do
  # workflow: o e-mail exigia `status == error`, então a degradação regulatória
  # não tinha NENHUM destino humano. Este job fecha isso sem mexer no HTTP.
  #
  # Cadência de 1x/hora, não 5 min: a condição muda em escala de dias e o TTL da
  # probe é de 15 min. Alertar a cada 5 minutos sobre o mesmo fato ensina o
  # plantão a ignorar o alerta — que é como um sinal morre.
  regulatory-freshness:
    name: Frescor regulatório cClassTrib
    if: github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Probe regulatory freshness
        id: reg
        run: |
          RESPONSE=$(curl -sf --max-time 20 \
            https://api.tribultz.com.br/health/deep 2>&1) || {
            echo "state=unreachable" >> "$GITHUB_OUTPUT"
            echo "detail=API inalcançável" >> "$GITHUB_OUTPUT"
            exit 0
          }
          RESPONSE="$RESPONSE" python3 - << 'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d = json.loads(os.environ["RESPONSE"])
          f = d.get("classtrib_freshness") or {}
          print(f"state={d.get('classtrib', 'unknown')}")
          print(f"freshness={f.get('status', 'unknown')}")
          print(f"source={f.get('source_state', 'unknown')}")
          print(f"age={f.get('bundled_version_age_days', '?')}")
          print(f"version={f.get('bundled_version_date', '?')}")
          # `detail` do payload é gerado por nós e só contém contagens — a origem
          # não escreve aqui (ver sanitização em regulatory_freshness.py).
          print(f"detail={f.get('detail', '')[:200]}")
          PY

      - name: Alertar humano se o dado regulatório não estiver íntegro
        if: steps.reg.outputs.state != 'ok'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STATE:     ${{ steps.reg.outputs.state }}
          FRESHNESS: ${{ steps.reg.outputs.freshness }}
          SOURCE:    ${{ steps.reg.outputs.source }}
          AGE:       ${{ steps.reg.outputs.age }}
          VERSION:   ${{ steps.reg.outputs.version }}
          DETAIL:    ${{ steps.reg.outputs.detail }}
        run: |
          echo "::warning::Frescor regulatório: ${{ steps.reg.outputs.state }} — ${{ steps.reg.outputs.detail }}"
          python3 - << 'PY'
          import os, json, urllib.request, urllib.error
          e = os.environ
          html = (
            "<h2>Frescor do dado regulatório cClassTrib</h2>"
            "<p>O produto <b>continua disponível</b> — isto não é indisponibilidade. "
            "É a tabela oficial que pode estar desatualizada ou não verificável.</p>"
            f"<ul><li><b>Estado:</b> {e['STATE']} ({e['FRESHNESS']})</li>"
            f"<li><b>Fonte SVRS:</b> {e['SOURCE']}</li>"
            f"<li><b>Versão embarcada:</b> {e['VERSION']} ({e['AGE']} dias)</li>"
            f"<li><b>Detalhe:</b> {e['DETAIL']}</li></ul>"
            "<p><a href='https://api.tribultz.com.br/health/deep'>Ver health</a> · "
            "<a href='https://github.com/mickbap/tribultz/actions/workflows/classtrib-sync.yml'>Ver classtrib-sync</a></p>"
          )
          req = urllib.request.Request(
            "https://api.resend.com/emails",
            data=json.dumps({
              "from": "noreply@tribultz.com.br",
              "to": ["mickel@tribultz.com.br"],
              "subject": f"[REGULATÓRIO] cClassTrib — {e['STATE']}/{e['FRESHNESS']} ({e['AGE']}d)",
              "html": html,
            }).encode(),
            headers={"Authorization": f"Bearer {e['RESEND_API_KEY']}",
                     "Content-Type": "application/json",
                     # WAF do Resend bloqueia o UA padrão do urllib — ver o job acima.
                     "User-Agent": "tribultz-ci/1.0"},
          )
          try:
            with urllib.request.urlopen(req, timeout=10) as r:
              print("Alert sent:", r.status)
          except urllib.error.HTTPError as ex:
            raise SystemExit(f"Resend error: {ex.read().decode()}")
          PY
