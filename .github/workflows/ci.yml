name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tribultz
          POSTGRES_PASSWORD: tribultz
          POSTGRES_DB: tribultz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tribultz -d tribultz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_PASSWORD: test_pass
      DATABASE_URL: postgresql://tribultz:tribultz@localhost:5432/tribultz
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: static_secret_for_test_purposes_only_32_chars
      MINIO_ROOT_USER: test_user
      MINIO_ROOT_PASSWORD: test_password
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: test-bucket
      S3_ACCESS_KEY: test_key
      S3_SECRET_KEY: test_secret
      ENV: ci
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python (pin)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.6"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            pyproject.toml
            backend/pyproject.toml

      - name: Setup Node (pin) # needed for pyright via npx
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip uv
          if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi
          if [ -f pyproject.toml ]; then uv pip install --system -e ".[dev]" || uv pip install --system -e "."; fi
          uv pip install --system "ruff==0.6.9" "pytest==8.3.3"

      - name: CrewAI import sanity
        working-directory: backend
        run: |
          python - << 'PY'
          import crewai
          import litellm
          from app.crews.crm_engagement_crew import CRMEngagementCrew
          from app.crews.security_crew import TribultzSecurityCrew
          from app.crews.nfe_validation_crew import NFeValidationCrew
          print("crewai import ok")
          print("litellm import ok")
          print("crm engagement crew import ok", bool(CRMEngagementCrew))
          print("security crew import ok", bool(TribultzSecurityCrew))
          print("nfe validation crew import ok", bool(NFeValidationCrew))
          PY
      - name: Wait for services healthy
        run: |
          python - << 'PY'
          import socket, time, sys
          def wait(host, port, name):
            for _ in range(60):
              try:
                with socket.create_connection((host, port), timeout=1):
                  print(f"{name} OK"); return
              except OSError:
                time.sleep(1)
            print(f"TIMEOUT waiting {name}"); sys.exit(1)
          wait("127.0.0.1", 5432, "postgres")
          wait("127.0.0.1", 6379, "redis")
          PY

      - name: Ruff (pin)
        working-directory: backend
        run: |
          ruff --version
          ruff check .

      - name: Pyright (pin)
        working-directory: backend
        env:
          POSTGRES_PASSWORD: test_pass
          DATABASE_URL: postgresql://u:p@localhost:5432/db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: static_secret_for_test_purposes_only_32_chars
          MINIO_ROOT_USER: test_user
          MINIO_ROOT_PASSWORD: test_password
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: test-bucket
          S3_ACCESS_KEY: test_key
          S3_SECRET_KEY: test_secret
        run: |
          npx --yes pyright@1.1.386 --version
          npx --yes pyright@1.1.386

      - name: DB migrate (alembic)
        working-directory: backend
        run: |
          python -m alembic -c alembic.ini upgrade head

      - name: Pytest
        working-directory: backend
        run: |
          pytest -q

      - name: Architecture Audit (informativo)
        working-directory: backend
        continue-on-error: true
        run: |
          python ../tools/architecture_audit.py

      - name: QA Gates (report)
        run: |
          python tools/qa_gates/run_gates.py --mode ci

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qa_gates_report
          path: reports/qa_gates_report.md

  frontend:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Cloudflare Turnstile — chave de teste "always-pass" (oficial Cloudflare)
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      # API aponta para localhost em CI (Next.js CSP construído em build time)
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (pin)
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install + build
        run: |
          if [ -f package-lock.json ]; then npm ci && npm run build; exit 0; fi
          if [ -f frontend/package-lock.json ]; then cd frontend && npm ci && npm run build; exit 0; fi
          echo "No frontend detected (package-lock.json not found). Skipping build." && exit 0

      - name: Install Playwright browser
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium

      - name: Start frontend server
        working-directory: frontend
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/tribultz-next.log 2>&1 &

      - name: Wait for frontend server
        run: |
          python - << 'PY'
          import time
          import urllib.request
          url = "http://127.0.0.1:3100/calculadora"
          for _ in range(60):
            try:
              with urllib.request.urlopen(url, timeout=2) as response:
                if response.status == 200:
                  print("frontend OK")
                  raise SystemExit(0)
            except Exception:
              time.sleep(1)
          raise SystemExit("timeout waiting frontend")
          PY

      - name: Frontend calculator smoke
        working-directory: frontend
        env:
          CALCULADORA_E2E_BASE_URL: http://127.0.0.1:3100
        run: |
          npm run test:e2e
