name: cClassTrib Data Sync

# Mantém a tabela oficial cClassTrib (app/data/classtrib.json) + o mapeamento NCM fresca.
# A SVRS adiciona códigos com frequência (ex.: +8 em 2 dias) — sem isto, o motor decai:
# as regras de cClassTrib (incl. a Rejeição 1024) deixam de cobrir os códigos novos.
# Gate: abre PR (needs-review) — dado fiscal não entra sem revisão humana.

on:
  schedule:
    - cron: "0 8 * * *"   # diário, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: classtrib-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps (httpx)
        run: pip install httpx

      - name: Re-sync cClassTrib (SVRS) → JSON
        run: python backend/scripts/resync_classtrib.py

      - name: Abrir PR de revisão
        uses: peter-evans/create-pull-request@v8
        with:
          branch: classtrib-sync/auto
          title: "chore(data): atualização da tabela cClassTrib (SVRS)"
          commit-message: "chore(data): re-sync cClassTrib + mapeamento NCM (SVRS)"
          labels: "data-sync,needs-review"
          add-paths: |
            backend/app/data/classtrib.json
            backend/app/data/ncm_cclasstrib.json
          body: |
            Re-sincronização automática da tabela oficial **cClassTrib** e do mapeamento NCM
            a partir da consulta pública SVRS (sem credencial).

            ⚠️ **Revisar antes do merge:**
            - Conferir o **diff** (novos códigos / remoções) — o `print_diff` do script aborta se < 74 ou drop > limite.
            - Se o **total de códigos mudou**, atualizar `CLASSTRIB_COUNT` em `frontend/src/lib/validation/rulesMeta.ts` (stat do site).
            - (Follow-up) re-seed do DB `cclass_trib_items` (endpoint público `/classtrib`) — exige migration própria.

            Gerado por `.github/workflows/classtrib-sync.yml`.

      # #446 — sem isto, uma falha (SVRS fora do ar, guard de diff abortando)
      # passa despercebida: sem PR, sem e-mail, sem issue. Mesmo padrão de
      # alerta via Resend já usado em monitor.yml.
      - name: Alertar falha do sync (Resend)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - << 'PY'
          import os, json, urllib.request, urllib.error

          key = os.environ["RESEND_API_KEY"]
          run_url = os.environ.get("RUN_URL", "")

          payload = json.dumps({
            "from": "noreply@tribultz.com.br",
            "to":   ["mickel@tribultz.com.br"],
            "subject": "[ALERTA] cClassTrib Data Sync falhou",
            "html": f"<h2>Sync diário da tabela cClassTrib falhou</h2>"
                    f"<p>Sem re-sync, o motor de validação fiscal decai silenciosamente "
                    f"(regras de cClassTrib, incl. Rejeição 1024, deixam de cobrir códigos novos da SVRS).</p>"
                    f"<p><a href='{run_url}'>Ver execução no GitHub Actions</a></p>",
          }).encode()

          req = urllib.request.Request(
            "https://api.resend.com/emails",
            data=payload,
            headers={
              "Authorization": f"Bearer {key}",
              "Content-Type":  "application/json",
              # Sem isto, o urllib manda "Python-urllib/3.x" como User-Agent — o WAF
              # (Cloudflare) na frente da API do Resend bloqueia com 403 "error code:
              # 1010" ("banned based on your browser's signature"). Confirmado em
              # produção (2026-07-20): o alerta deste mesmo workflow nunca chegou a
              # ser entregue na falha real do dia anterior, mesmo reportando sucesso
              # no job — falha silenciosa do próprio mecanismo de último recurso.
              "User-Agent": "tribultz-ci/1.0",
            },
          )
          try:
            with urllib.request.urlopen(req, timeout=10) as r:
              print("Alert sent:", r.status)
          except urllib.error.HTTPError as e:
            # Antes só imprimia — o step reportava sucesso mesmo com a entrega
            # falhando (mesmo incidente do 403/1010 acima). Falhar de verdade aqui
            # é o que torna uma futura quebra do próprio alerta visível.
            raise SystemExit(f"Resend error: {e.read().decode()}")
          PY
