# ============================================================
# Tribultz – Docker Compose Stack
# ============================================================

x-backend-env: &backend-env
  env_file:
    - ../.env
  environment:
    PYTHONUNBUFFERED: "1"

# Rede única explícita — garante DNS interno consistente após rebuilds
# isolados (--no-deps). Sem declaração explícita, o Docker Compose cria
# "infra_default" mas pode perder serviços no reconnect pós-rebuild.
networks:
  tribultz:
    driver: bridge

services:
  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [tribultz]
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [tribultz]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MinIO (S3-compatible storage) ─────────────────────────
  # Tag fixada (era :latest — build não-reprodutível, achado da auditoria de
  # dependências 2026-07-18). RELEASE.2025-09-07T16-13-09Z é a mesma imagem
  # que :latest resolve hoje (confirmado via Docker Hub — MinIO não publica
  # imagem nova desde então). Atualizar deliberadamente via PR quando uma
  # release nova for avaliada, não por pull automático.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    networks: [tribultz]
    env_file:
      - ../.env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Migrations (one-shot) ─────────────────────────────────
  # Alembic é a fonte única do schema (#409) — o schema.sql foi aposentado.
  # Roda `upgrade head` em todo `up` (no-op quando o banco já está em head);
  # api/worker/beat só sobem após a conclusão bem-sucedida.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: "no"
    networks: [tribultz]
    <<: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  # ── FastAPI (API) ─────────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [tribultz]
    <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Celery Worker ─────────────────────────────────────────
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [tribultz]
    <<: *backend-env
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    # Sobrescreve o HEALTHCHECK do Dockerfile (curl :8000/health) — worker não
    # serve HTTP, sempre reportaria "unhealthy" por design, não por defeito (#522).
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Celery Beat (scheduler) ──────────────────────────────
  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [tribultz]
    <<: *backend-env
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    # Sobrescreve o HEALTHCHECK do Dockerfile — beat não serve HTTP nem responde
    # a inspect (é só o scheduler, sem RPC de worker) (#522). Sem checagem nativa
    # equivalente; "container rodando" já é o sinal disponível.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  minio_data:
