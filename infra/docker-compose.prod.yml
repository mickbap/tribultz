# ============================================================
# Tribultz — Production Stack (Magalu Cloud)
# ============================================================
#
# Serviços neste stack:
#   - redis    : broker Celery + cache (container)
#   - api      : FastAPI (2 workers, sem --reload)
#   - worker   : Celery worker (concurrency=2)
#   - beat     : Celery beat (scheduler)
#
# Serviços EXTERNOS (não containers):
#   - PostgreSQL : Magalu DBaaS  → DATABASE_URL no .env
#   - S3         : Magalu Object Storage → S3_* vars no .env
#
# Uso:
#   cp .env.prod.template /opt/tribultz/.env   # preencher REQUIRED
#   docker compose -f infra/docker-compose.prod.yml up -d
# ============================================================

# ── Âncoras ──────────────────────────────────────────────────────────────────

x-common: &common
  env_file: ../.env              # /opt/tribultz/.env na VM
  environment:
    PYTHONUNBUFFERED: "1"        # único override — não sobrescreve vars do .env
  restart: unless-stopped
  networks:
    - internal
  # CIS Docker Benchmark 5.25 — previne escalada de privilégios via setuid/setgid
  security_opt:
    - no-new-privileges:true
  # CIS Docker Benchmark 5.3 — remove todas as Linux capabilities desnecessárias
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# ── Serviços ─────────────────────────────────────────────────────────────────

services:

  # ── Redis (broker + cache) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    <<: *common
    command:
      - redis-server
      - --appendonly yes
      - --requirepass ${REDIS_PASSWORD}
      - --maxmemory 200mb
      - --maxmemory-policy allkeys-lru
      - --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ── FastAPI ────────────────────────────────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    <<: *common
    ports:
      - "127.0.0.1:8000:8000"    # exposto apenas para nginx local
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ── Celery Worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    <<: *common
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
      - --max-tasks-per-child=500
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  # ── Celery Beat ────────────────────────────────────────────────────────────
  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    <<: *common
    command:
      - celery
      - -A
      - app.celery_app
      - beat
      - --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

# ── Redes ─────────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local
