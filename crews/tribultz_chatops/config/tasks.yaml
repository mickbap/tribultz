classify_intent:
  description: >
    Classify the user message into one of: validate, validate_nfse, unknown.
    Before deciding, consult crew memory for similar fiscal messages and prior classifications
    from the same tenant. If a similar note was previously routed successfully, prefer the
    same intent unless the current message clearly contradicts that precedent.
    Use only these rules:
    - validate_nfse: message contains XML content (starts with < or contains <?xml or <NFS-e or <nfseMsg)
    - validate: message contains keywords like "validar", "validate", "CBS", "IBS", "invoice"
    - unknown: anything else
    Do not invent. Pass through the original user message unchanged.
    Message: {message}
  expected_output: >
    A single word: validate OR validate_nfse OR unknown.

execute_operation:
  description: >
    Execute the operation for tenant {tenant_id} based on the triage intent:

    IF intent is "validate":
      - Call trigger_task_a with the invoice_number from the user message (default: INV-UNKNOWN)
      - Return: {{"intent": "validate", "job_id": "<uuid>"}}

    IF intent is "validate_nfse":
      - Call parse_nfse_xml with the XML content from the user message
      - Then call validate_fiscal_rules with the invoice_id and fields_json from parse_nfse_xml output
      - Return: {{"intent": "validate_nfse", "invoice_id": "<uuid>", "findings": [...]}}

    IF intent is "unknown":
      - Return: {{"intent": "unknown"}}
  expected_output: >
    JSON with intent and result fields as described above.

compose_response:
  description: >
    Write response_markdown and evidence[] based on the operation result.

    For intent="validate":
      evidence: [{type: "job", job_id: "<uuid>", href: "/jobs/<uuid>", label: "Validation job"}]

    For intent="validate_nfse":
      Summarize findings in response_markdown. List each finding as a bullet with rule_id, severity, and recommendation.
      evidence: [{type: "audit", href: "/invoices/<invoice_id>", label: "NFS-e validation", payload: {findings: [...]}}]

    For intent="unknown":
      response_markdown: polite message saying the request was not understood.
      evidence: []
  expected_output: >
    JSON with: {"response_markdown": "...", "evidence": [{...}]}.

qa_validate_gates:
  description: >
    Execute os gates finais do Tribultz e produza um relatório anexável em PR.

    Gates obrigatórios (mínimo):
    1) Auth: /api/v1/chat/message retorna 401 sem token
    2) Anti-IDOR (Jobs): tenant B não acessa job do tenant A (404/403)
    3) Contrato /chat/message:
       - conversation_id (uuid)
       - response_markdown (string)
       - evidence[] tipada: {type:"job", job_id, href, label}
    4) Valida 422 quando message > 4000 chars
    5) Valida 429 rate limit (login e/ou chat) sem flakiness
    6) ruff / pyright / pytest (pass)
    7) build do frontend (pass)

    Seu relatório final DEVE:
    - ter uma seção por gate (✅/❌)
    - para cada ❌ incluir causa provável, evidência (log/stack/endpoint) e ação recomendada
    - concluir com risco e recomendação GO/NO-GO
  expected_output: >
    Um arquivo Markdown em reports/qa_gates_report.md com gates ✅/❌, falhas acionáveis e recomendação final.
  agent: qa_specialist
